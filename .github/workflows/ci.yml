# Runs sim/ci.sh on GitHub's servers on every push and pull request.
# Checks: Verilator lint, Yosys latch check, Icarus self-checking tests (tb/tb_*.sv).
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog, Verilator, Yosys
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iverilog verilator yosys
          iverilog -V 2>&1 | head -1; verilator --version; yosys -V
      - name: Lint, latch check, tests
        run: bash sim/ci.sh
      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            sim/*.out
            sim/*.log
            sim/yosys_stat.txt
          if-no-files-found: ignore
